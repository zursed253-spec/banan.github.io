name: Extra games tests
on:
  push:
    paths:
      - "games-extra.js"
      - "games-realtime.js"
      - "games-realtime.css"
      - "tests/realtime-games.test.cjs"
      - "index.html"
      - "tests/hub-modes.test.cjs"
      - "games-cards.js"
      - "games-extra.css"
      - "site.css"
      - "site-personalize.js"
      - "tests/site-personalize.test.cjs"
      - "tests/extra-games.test.cjs"
      - "tests/game-cards.test.cjs"
      - ".github/workflows/extra-games-test.yml"
  pull_request:
    paths:
      - "games-extra.js"
      - "index.html"
      - "tests/hub-modes.test.cjs"
      - "games-cards.js"
      - "games-extra.css"
      - "site.css"
      - "site-personalize.js"
      - "tests/site-personalize.test.cjs"
      - "tests/extra-games.test.cjs"
      - "tests/game-cards.test.cjs"
      - ".github/workflows/extra-games-test.yml"
jobs:
  extra-games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check games-extra.js
      - run: node --check games-cards.js
      - run: node --check games-realtime.js
      - run: node --check site-personalize.js
      - run: node --test tests/extra-games.test.cjs tests/game-cards.test.cjs tests/realtime-games.test.cjs tests/site-personalize.test.cjs tests/hub-modes.test.cjs
