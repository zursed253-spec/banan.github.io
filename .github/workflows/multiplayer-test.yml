name: Multiplayer server tests
on:
  push:
    paths:
      - "server/**"
      - "index.html"
      - "games-extra.js"
      - ".github/workflows/multiplayer-test.yml"
  pull_request:
    paths:
      - "server/**"
      - "index.html"
      - "games-extra.js"
      - ".github/workflows/multiplayer-test.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
